<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#efe6d9">
<title>Miray & Ramazan | Nişan Davetiyesi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="locked">
<audio id="music" src="assets/muzik.mp3" preload="auto"></audio>

<section id="cover" class="cover" aria-label="Davetiyeyi aç">
  <div class="door left"></div>
  <div class="door right"></div>
  <button id="seal" class="seal-button" aria-label="Davetiyeyi aç"></button>
  <div class="tap-copy"><span>AÇMAK İÇİN</span><em>dokunun</em></div>
</section>

<button id="musicToggle" class="music-toggle" aria-label="Müziği aç veya kapat">♪</button>

<main id="invite" class="invite" aria-hidden="true">
  <section class="approved-top">
    <img src="assets/davetiye.png" alt="Miray ve Ramazan nişan davetiyesi, 12 Eylül 2026 Cumartesi saat 20:00">
  </section>

  <section class="continuation">
    <img class="emboss emboss-left" src="assets/leaf-left.png" alt="">
    <img class="emboss emboss-right" src="assets/leaf-right.png" alt="">

    <section class="block countdown-block">
      <h2>BÜYÜK GÜNE KALAN SÜRE</h2>
      <div class="counter">
        <div><strong id="days">00</strong><span>GÜN</span></div>
        <div><strong id="hours">00</strong><span>SAAT</span></div>
        <div><strong id="minutes">00</strong><span>DK</span></div>
        <div><strong id="seconds">00</strong><span>SN</span></div>
      </div>
    </section>

    <div class="single-gold-heart" aria-hidden="true"><span>♥︎</span></div>

    <section class="block flow-block">
      <h2>NİŞAN AKIŞI</h2>
      <div class="timeline">
        <article><time>20:00</time><span>Karşılama &amp; İsteme</span></article>
        <article><time>20:30</time><span>Yüzük Merasimi</span></article>
        <article><time>21:00</time><span>Eğlence</span></article>
        <article><time>23:30</time><span>Kapanış</span></article>
      </div>
    </section>

    <section class="block venue-block">
      <div class="wing-motif venue-separator" aria-hidden="true">
        <span class="line"></span>
        <span class="leaf">❧</span><span class="heart">♥︎</span><span class="leaf flip">❧</span>
        <span class="line flip-line"></span>
      </div>
      <h2>MEKAN</h2>
      <h3>Harmonie Davet Evi</h3>
      <p>Aşağı Mahallesi, Şaban Çavuş Caddesi No:23<br>Acıpayam / Denizli</p>

      <a class="map-wrap" href="https://maps.app.goo.gl/Lww8wdSa7mQRnWNNA?g_st=iw" target="_blank" rel="noopener" aria-label="Harmonie Davet Evi konumunu aç">
        <iframe
          title="Harmonie Davet Evi - Acıpayam konumu"
          src="https://www.openstreetmap.org/export/embed.html?bbox=29.3485%2C37.4304%2C29.3595%2C37.4373&amp;layer=mapnik&amp;marker=37.433853%2C29.353998"
          loading="lazy"></iframe>
        <span class="map-overlay" aria-hidden="true"></span>
      </a>

      <a class="route" href="https://maps.app.goo.gl/Lww8wdSa7mQRnWNNA?g_st=iw" target="_blank" rel="noopener">YOL TARİFİ AL</a>

      <div class="footer-gold-heart" aria-hidden="true">♥</div>
    </section>
  </section>
</main>
<script src="script.js"></script>
</body>
</html>
